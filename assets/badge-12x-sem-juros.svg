<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <!-- Rich Golden Gradients -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5C798" />
      <stop offset="35%" stop-color="#C5A880" />
      <stop offset="70%" stop-color="#9C7E55" />
      <stop offset="100%" stop-color="#DEBE90" />
    </linearGradient>
    <linearGradient id="badgeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1816" />
      <stop offset="100%" stop-color="#0F0E0D" />
    </linearGradient>
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <g filter="url(#subtleShadow)">
    <!-- Outer Background Circle -->
    <circle cx="150" cy="150" r="140" fill="url(#badgeBg)" stroke="url(#goldGradient)" stroke-width="4.5" />
    
    <!-- Inner Concentric Ring -->
    <circle cx="150" cy="150" r="126" fill="none" stroke="url(#goldGradient)" stroke-width="1.8" stroke-opacity="0.85" />
    <circle cx="150" cy="150" r="122" fill="none" stroke="url(#goldGradient)" stroke-width="0.75" stroke-opacity="0.4" stroke-dasharray="3, 3" />
    
    <!-- Top Header Text: — TUDO EM — -->
    <g transform="translate(150, 68)">
      <!-- Left line -->
      <line x1="-100" y1="-5" x2="-62" y2="-5" stroke="url(#goldGradient)" stroke-width="1.5" stroke-linecap="round"/>
      <!-- Text -->
      <text text-anchor="middle" y="0" font-family="'Cinzel', 'Playfair Display', 'Outfit', sans-serif" font-size="16" font-weight="700" fill="url(#goldGradient)" letter-spacing="3.5">
        TUDO EM
      </text>
      <!-- Right line -->
      <line x1="62" y1="-5" x2="100" y2="-5" stroke="url(#goldGradient)" stroke-width="1.5" stroke-linecap="round"/>
    </g>

    <!-- Left Rays / Accent Marks -->
    <g stroke="url(#goldGradient)" stroke-linecap="round" fill="none">
      <path d="M 52 120 L 38 108" stroke-width="3" stroke-linecap="round"/>
      <path d="M 48 144 L 32 144" stroke-width="3.5" stroke-linecap="round"/>
      <path d="M 52 168 L 38 180" stroke-width="3" stroke-linecap="round"/>
    </g>

    <!-- Right Rays / Accent Marks -->
    <g stroke="url(#goldGradient)" stroke-linecap="round" fill="none">
      <path d="M 248 120 L 262 108" stroke-width="3" stroke-linecap="round"/>
      <path d="M 252 144 L 268 144" stroke-width="3.5" stroke-linecap="round"/>
      <path d="M 248 168 L 262 180" stroke-width="3" stroke-linecap="round"/>
    </g>

    <!-- Center Big 12x -->
    <text x="144" y="172" text-anchor="middle" font-family="'Cinzel', 'Playfair Display', 'Didot', serif" font-size="108" font-weight="900" font-style="italic" fill="url(#goldGradient)" letter-spacing="-2">
      12<tspan font-size="76" font-style="normal" font-weight="800" font-family="'Outfit', 'Inter', sans-serif" dx="2" dy="-10">x</tspan>
    </text>

    <!-- Divider Line Above SEM JUROS -->
    <line x1="45" y1="202" x2="255" y2="202" stroke="url(#goldGradient)" stroke-width="2.2" stroke-linecap="round"/>

    <!-- Bottom Text: SEM JUROS -->
    <text x="150" y="235" text-anchor="middle" font-family="'Outfit', 'Inter', sans-serif" font-size="23" font-weight="800" fill="url(#goldGradient)" letter-spacing="4">
      SEM JUROS
    </text>

    <!-- Divider Line Below SEM JUROS -->
    <line x1="80" y1="248" x2="220" y2="248" stroke="url(#goldGradient)" stroke-width="1.8" stroke-linecap="round"/>
  </g>
</svg>
