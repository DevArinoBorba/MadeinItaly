<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Dark Disc Gradient -->
    <radialGradient id="discBg" cx="45%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#181614" />
      <stop offset="65%" stop-color="#0B0A09" />
      <stop offset="100%" stop-color="#050505" />
    </radialGradient>

    <!-- Metallic Gold Face Gradient -->
    <linearGradient id="goldFace" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#FFF0CC" />
      <stop offset="25%" stop-color="#ECC880" />
      <stop offset="50%" stop-color="#C59B4B" />
      <stop offset="75%" stop-color="#E5C175" />
      <stop offset="100%" stop-color="#A2772C" />
    </linearGradient>

    <!-- Bevel 3D Shadow Side -->
    <linearGradient id="goldShadowSide" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7B541E" />
      <stop offset="50%" stop-color="#4E3310" />
      <stop offset="100%" stop-color="#2D1D08" />
    </linearGradient>

    <!-- Bevel 3D Light Side -->
    <linearGradient id="goldLightSide" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF8E7" />
      <stop offset="40%" stop-color="#E5C175" />
      <stop offset="100%" stop-color="#8C6120" />
    </linearGradient>

    <!-- Subtle Drop Shadow for 3D depth -->
    <filter id="gold3dShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.85" />
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#D4AF37" flood-opacity="0.15" />
    </filter>

    <linearGradient id="innerGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFEBB8" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#FFEBB8" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#C59B4B" stop-opacity="0.4"/>
    </linearGradient>
  </defs>

  <!-- Circular Black Disc (Transparent outer canvas) -->
  <circle cx="256" cy="256" r="240" fill="url(#discBg)" stroke="rgba(199, 174, 141, 0.15)" stroke-width="1.5"/>

  <!-- 3D Extrusion / Bevel Base Layer -->
  <g filter="url(#gold3dShadow)">
    
    <!-- Outer 3D Side Shadow -->
    <path d="M 124 140 H 206 L 256 270 L 306 140 H 388 V 376 H 328 V 212 L 274 340 H 238 L 184 212 V 376 H 124 Z" 
          fill="url(#goldShadowSide)" transform="translate(0, 6)" />

    <!-- Outer 3D Bevel Rim -->
    <path d="M 124 138 H 208 L 256 268 L 304 138 H 388 V 374 H 328 V 212 L 274 340 H 238 L 184 212 V 374 H 124 Z" 
          fill="url(#goldShadowSide)" />

    <!-- Main Front Facet of Letter M -->
    <path d="M 128 140 H 204 L 256 268 L 308 140 H 384 V 372 H 330 V 214 L 273 338 H 239 L 182 214 V 372 H 128 Z" 
          fill="url(#goldFace)" stroke="url(#goldLightSide)" stroke-width="2.5" />

    <!-- Top Highlight Bevel Lines -->
    <line x1="128" y1="140" x2="204" y2="140" stroke="#FFF7E0" stroke-width="3" stroke-linecap="round"/>
    <line x1="308" y1="140" x2="384" y2="140" stroke="#FFF7E0" stroke-width="3" stroke-linecap="round"/>

    <!-- Inner Golden Reflection Contour -->
    <path d="M 132 144 H 200 L 256 264 L 312 144 H 380 V 368 H 334 V 218 L 272 334 H 240 L 178 218 V 368 H 132 Z" 
          fill="none" stroke="url(#innerGlow)" stroke-width="1.8" />
  </g>
</svg>
